# Build-time environment for the Servo dependency.
#
# Stylo's style-computation worker threads default to a small stack (512 KB for
# the Servo build). Deeply nested CSS on real-world sites (e.g. Facebook) can
# overflow it and abort the StyleThread, which is a hard crash, not a graceful
# error. Upstream Servo raises this to 8 MiB to match Chromium's recursion
# depth; it only reserves virtual address space and has near-zero real cost.
# See https://github.com/servo/servo/pull/43888
#
# This value is read by stylo at compile time via option_env!, so a change here
# requires stylo to be rebuilt: `cargo clean -p stylo && cargo build`.
[env]
SERVO_STYLE_THREAD_STACK_SIZE_KB = "8192"
