[package]
name = "craft-transfers"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["CraftBrowsing Contributors"]
description = "Unified transfer engine for CraftBrowsing: segmented HTTP and magnet/torrent downloads."
license = "MPL-2.0 OR Apache-2.0"

[dependencies]
anyhow = "1"
dirs = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "charset", "http2", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.40", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"

# librqbit is added when the magnet engine is wired in.
# librqbit = { version = "9", default-features = false, features = ["rust-tls"] }

[dev-dependencies]
tempfile = "3"
