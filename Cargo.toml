[workspace]
resolver = "3"
members = [
    "crates/craft-core",
    "crates/craft-engine",
    "crates/craft-ui",
    "crates/craft-storage",
    "crates/craft-adblock",
    "crates/craft-sync",
    "crates/craft-transfers",
    "crates/craft-plugins",
]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
deno_core = "0.300"
adblock = "0.9"
winit = "0.30"
dirs = "5"
thiserror = "2"
