[workspace]
resolver = "3"
members = [
    "crates/craft-core",
    "crates/craft-engine",
    "crates/craft-ui",
    "crates/craft-storage",
    "crates/craft-adblock",
    "crates/craft-sync",
    "crates/craft-transfers",
    "crates/craft-plugins",
]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.38", features = ["bundled"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
deno_core = "0.300"
adblock = "0.9"
winit = "0.30"
servo = "0.8.0"
euclid = "0.22"
url = "2.5"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
egui = "0.34.3"
egui-winit = { version = "0.34.3", default-features = false }
egui_glow = { version = "0.34.3", default-features = false, features = ["winit", "x11", "wayland"] }
glow = "0.17"
dirs = "5"
thiserror = "2"
rmp = "=0.8.14"

