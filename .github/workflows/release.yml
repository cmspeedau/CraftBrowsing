name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-${{ matrix.target }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config

      - name: Build release binary
        run: cargo build --release -p craft-ui --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: craft-ui-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/craft-ui*

  package-linux:
    name: Package Linux AppImage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: craft-ui-x86_64-unknown-linux-gnu
          path: dist

      - name: Install AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/scalable/apps \
            AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/craft-ui AppDir/usr/bin/craft-browsing
          chmod +x AppDir/usr/bin/craft-browsing
          cp assets/craft-browsing.svg AppDir/craft-browsing.svg
          cp assets/craft-browsing.svg AppDir/usr/share/icons/hicolor/scalable/apps/craft-browsing.svg
          cp assets/craft-browsing.svg AppDir/usr/share/icons/hicolor/256x256/apps/craft-browsing.svg
          cat > AppDir/craft-browsing.desktop <<'EOF'
          [Desktop Entry]
          Name=CraftBrowsing
          Exec=craft-browsing
          Icon=craft-browsing
          Type=Application
          Categories=Network;WebBrowser;
          X-AppImage-UpdateInformation=zsync|https://github.com/cmspeedau/CraftBrowsing/releases/latest/download/CraftBrowsing-x86_64.AppImage.zsync
          EOF
          cp AppDir/craft-browsing.desktop AppDir/usr/share/applications/
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool AppDir CraftBrowsing-x86_64.AppImage

      - name: Generate zsync metadata
        run: |
          zsyncmake CraftBrowsing-x86_64.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            CraftBrowsing-x86_64.AppImage
            CraftBrowsing-x86_64.AppImage.zsync

  package-windows:
    name: Package Windows
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: craft-ui-x86_64-pc-windows-msvc
          path: dist

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item dist/craft-ui.exe staging/craft-browsing.exe
          if (-not (Test-Path staging/craft-browsing.exe)) { Get-ChildItem -Recurse dist }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: staging/craft-browsing.exe

  package-macos:
    name: Package macOS DMG
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: craft-ui-aarch64-apple-darwin
          path: dist

      - name: Create app bundle
        run: |
          mkdir -p "CraftBrowsing.app/Contents/MacOS" "CraftBrowsing.app/Contents/Resources"
          cp dist/craft-ui "CraftBrowsing.app/Contents/MacOS/CraftBrowsing"
          chmod +x "CraftBrowsing.app/Contents/MacOS/CraftBrowsing"
          cat > "CraftBrowsing.app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>CraftBrowsing</string>
            <key>CFBundleExecutable</key><string>CraftBrowsing</string>
            <key>CFBundleIdentifier</key><string>dev.craftbrowsing.app</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        run: |
          hdiutil create -volname "CraftBrowsing" -srcfolder "CraftBrowsing.app" -ov -format UDZO "CraftBrowsing-aarch64.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: CraftBrowsing-aarch64.dmg

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package-linux, package-windows, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release
          cp artifacts/linux-appimage/CraftBrowsing-x86_64.AppImage release/
          cp artifacts/linux-appimage/CraftBrowsing-x86_64.AppImage.zsync release/
          cp artifacts/windows-exe/craft-browsing.exe release/CraftBrowsing-x86_64.exe
          cp artifacts/macos-dmg/CraftBrowsing-aarch64.dmg release/
          ls -l release

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CraftBrowsing ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true